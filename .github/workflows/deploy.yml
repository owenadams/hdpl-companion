name: Deploy HDPL Companion

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.schedule.outputs.should_deploy }}
    steps:
      - name: Check the London-noon schedule slot
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_deploy=true
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            offset=$(TZ=Europe/London date +%z)
            if [[ "$SCHEDULE" == "0 11 * * *" && "$offset" != "+0100" ]] || [[ "$SCHEDULE" == "0 12 * * *" && "$offset" != "+0000" ]]; then
              should_deploy=false
            fi
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Check out source
        if: steps.schedule.outputs.should_deploy == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.schedule.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.should_deploy == 'true'
        run: npm ci

      - name: Refresh HDPL source snapshot
        if: steps.schedule.outputs.should_deploy == 'true'
        run: npm run refresh:data

      - name: Configure GitHub Pages
        if: steps.schedule.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build for the repository path
        if: steps.schedule.outputs.should_deploy == 'true'
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: steps.schedule.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4